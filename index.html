<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11443f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Squash Training" />
    <meta
      name="description"
      content="Plan PWA de entrenamiento de squash hasta el torneo del 7 de septiembre."
    />
    <title>Squash Training</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --ink: #17201f;
        --muted: #65716d;
        --paper: #f7f4ed;
        --panel: #fffdf7;
        --line: rgba(23, 32, 31, 0.12);
        --deep: #11443f;
        --green: #1e7a63;
        --mint: #d7f1e2;
        --coral: #f05c45;
        --gold: #e9b44c;
        --blue: #3f6ea8;
        --shadow: 0 18px 40px rgba(18, 38, 35, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 0%, rgba(233, 180, 76, 0.18), transparent 28rem),
          linear-gradient(180deg, #e8f0e9 0%, var(--paper) 26rem, #f9f6f0 100%);
      }

      button,
      input {
        font: inherit;
      }

      .app-shell {
        width: min(100%, 760px);
        min-height: 100vh;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px);
      }

      .hero {
        display: grid;
        gap: 16px;
        padding: 18px 2px 8px;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        box-shadow: 0 10px 20px rgba(17, 68, 63, 0.18);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 2.75rem;
        line-height: 0.92;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 34rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.45;
      }

      .status-pill {
        flex: 0 0 auto;
        border: 1px solid rgba(17, 68, 63, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.64);
        padding: 8px 10px;
        color: var(--deep);
        font-size: 0.8rem;
        font-weight: 750;
      }

      .progress-panel {
        display: grid;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 247, 0.8);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .progress-copy {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: end;
        font-weight: 780;
      }

      .progress-copy span {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 650;
      }

      .bar {
        width: 100%;
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(23, 32, 31, 0.1);
      }

      .bar span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--gold), var(--coral));
        transition: width 220ms ease;
      }

      .toolbar {
        position: sticky;
        top: calc(env(safe-area-inset-top) + 8px);
        z-index: 20;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
        align-items: center;
        margin: 12px 0 16px;
        padding: 8px;
        border: 1px solid rgba(17, 68, 63, 0.14);
        border-radius: 8px;
        background: rgba(250, 248, 241, 0.86);
        box-shadow: 0 12px 28px rgba(18, 38, 35, 0.12);
        backdrop-filter: blur(16px);
      }

      .nav-btn,
      .today-btn,
      .mini-btn {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: var(--deep);
        font-weight: 780;
        cursor: pointer;
        touch-action: manipulation;
      }

      .nav-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .today-btn {
        min-width: 74px;
        color: var(--deep);
        background: var(--mint);
      }

      .mini-btn {
        min-height: 38px;
        padding: 0 12px;
        color: var(--deep);
        background: rgba(30, 122, 99, 0.12);
      }

      .session {
        display: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .session.is-active {
        display: block;
      }

      .session-header {
        display: grid;
        gap: 12px;
        padding: 18px;
        color: #fff;
        background:
          linear-gradient(135deg, rgba(17, 68, 63, 0.95), rgba(30, 122, 99, 0.92)),
          var(--deep);
      }

      .session-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border-radius: 999px;
        padding: 5px 10px;
        color: #fff;
        background: rgba(255, 255, 255, 0.15);
        font-size: 0.78rem;
        font-weight: 760;
      }

      .session h2 {
        font-size: 1.65rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .session-goal {
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.42;
      }

      .session-body {
        display: grid;
        gap: 16px;
        padding: 16px;
      }

      .session-progress {
        display: grid;
        gap: 8px;
      }

      .activity-list {
        display: grid;
        gap: 10px;
      }

      .activity {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 10px;
        align-items: start;
        padding: 12px;
        border: 1px solid rgba(23, 32, 31, 0.1);
        border-radius: 8px;
        background: #ffffff;
      }

      .activity input {
        width: 24px;
        height: 24px;
        margin: 2px 0 0;
        accent-color: var(--green);
      }

      .activity strong {
        display: block;
        margin-bottom: 4px;
        font-size: 1rem;
      }

      .activity p {
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.45;
      }

      .activity.is-done {
        border-color: rgba(30, 122, 99, 0.34);
        background: #f1fbf5;
      }

      .activity.is-done strong,
      .activity.is-done p {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(30, 122, 99, 0.55);
      }

      .focus-box {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-radius: 8px;
        background: #f4f0e7;
        border: 1px solid rgba(23, 32, 31, 0.1);
      }

      .focus-box h3 {
        font-size: 1rem;
      }

      .focus-box p {
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.45;
      }

      .court {
        position: relative;
        min-height: 220px;
        border-radius: 8px;
        border: 2px solid rgba(17, 68, 63, 0.75);
        background:
          linear-gradient(rgba(17, 68, 63, 0.18) 2px, transparent 2px) 0 50% / 100% 2px
            no-repeat,
          linear-gradient(90deg, rgba(17, 68, 63, 0.18) 2px, transparent 2px) 50% 0 / 2px
            100% no-repeat,
          #e5f2e7;
        overflow: hidden;
      }

      .court .spot {
        position: absolute;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        color: #fff;
        background: var(--green);
        font-size: 0.72rem;
        font-weight: 850;
      }

      .court .center {
        width: 54px;
        height: 54px;
        background: var(--coral);
      }

      .footer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 0 2px 8px;
      }

      .note {
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.4;
      }

      @media (min-width: 700px) {
        .app-shell {
          padding-inline: 24px;
        }

        .hero {
          padding-top: 34px;
        }

        h1 {
          font-size: 4.2rem;
        }

        .session h2 {
          font-size: 2.25rem;
        }

        .session-body {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-label="Resumen del plan">
        <div class="brand-row">
          <div class="brand">
            <img src="./icons/icon-192.png" width="52" height="52" alt="" />
            <div>
              <p class="status-pill" id="dateStatus">Torneo 7 sep</p>

      <nav class="toolbar" aria-label="Navegación de sesiones">

      <div id="sessionsRoot"></div>
    </main>

    <script>

        },

          kind: "HIIT",

            ["Calentamiento", "10 min progresivos, sin prisa y sin rigidez."],

          goal: "Llegar con piernas vivas, no pesadas.",
          kind: "Descarga",
          activities: [

            ["Movilidad", "10-15 min de movilidad suave y respiración tranquila."]
          ]
        },
        {
          date: "2026-09-06",
          day: "Domingo 6 de septiembre",
          title: "Descanso",
          duration: "Libre",
          intensity: "Muy bajo",
          goal: "Guardar energía para competir.",
          kind: "Descanso",
          activities: [
            ["Descanso real", "Como máximo paseo suave y movilidad. No intentes compensar con una sesión de última hora."],
            ["Preparación", "Hidratación, alimentación normal y sueño. Deja listo lo que usarás el día del torneo."]
          ]
        },
        {
          date: "2026-09-07",
          day: "Lunes 7 de septiembre",
          title: "Torneo",
          duration: "20-25 min antes",
          intensity: "Activación",
          goal: "Que el primer intercambio intenso no sea la primera vez del día que subes pulsaciones.",
          kind: "Competencia",
          activities: [
            ["Activación previa", "5 min caminar o trote suave, 5 min movilidad dinámica, luego 3 repeticiones de 20 s desplazamiento rápido y 40 s descanso."],
            ["Último toque", "2 repeticiones de 10 s muy rápido y 50 s descanso. Luego descansa unos minutos antes de entrar."]

      const storageKey = "squash-training-progress-v1";
      const lastSessionKey = "squash-training-current-session-v2";
      const root = document.querySelector("#sessionsRoot");
      const prevBtn = document.querySelector("#prevBtn");
      const nextBtn = document.querySelector("#nextBtn");
      const todayBtn = document.querySelector("#todayBtn");
      const resetBtn = document.querySelector("#resetBtn");
      const globalProgressBar = document.querySelector("#globalProgressBar");
      const globalProgressLabel = document.querySelector("#globalProgressLabel");
      const dateStatus = document.querySelector("#dateStatus");
      const totalActivities = sessions.reduce((sum, session) => sum + session.activities.length, 0);
      let currentIndex = getInitialIndex();
      let progress = readProgress();

      function readProgress() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch {
          return {};
        }
      }

      function writeProgress() {
        localStorage.setItem(storageKey, JSON.stringify(progress));
      }

      function getInitialIndex() {
        const hashMatch = window.location.hash.match(/sesion-(\d+)/);
        if (hashMatch) {
          return clamp(Number(hashMatch[1]) - 1, 0, sessions.length - 1);
        }
        const stored = Number(localStorage.getItem(lastSessionKey));
        return Number.isFinite(stored) ? clamp(stored, 0, sessions.length - 1) : getTodayIndex();
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getTodayIndex() {
        const today = new Date();
        const todayKey = [
          today.getFullYear(),
          String(today.getMonth() + 1).padStart(2, "0"),
          String(today.getDate()).padStart(2, "0")
        ].join("-");
        const exact = sessions.findIndex((session) => session.date === todayKey);
        if (exact >= 0) return exact;
        const todayTime = new Date(todayKey + "T00:00:00").getTime();
        const firstTime = new Date(sessions[0].date + "T00:00:00").getTime();
        const lastTime = new Date(sessions[sessions.length - 1].date + "T00:00:00").getTime();
        if (todayTime < firstTime) return 0;
        if (todayTime > lastTime) return sessions.length - 1;
        return sessions.findIndex((session) => new Date(session.date + "T00:00:00").getTime() >= todayTime);
      }

      function activityKey(sessionIndex, activityIndex) {
        return `${sessions[sessionIndex].date}-${activityIndex}`;
      }

      function renderSessions() {
        root.innerHTML = sessions
          .map((session, sessionIndex) => {
            const activities = session.activities
              .map(([title, description], activityIndex) => {
                const key = activityKey(sessionIndex, activityIndex);
                const checked = Boolean(progress[key]);
                return `
                  <label class="activity ${checked ? "is-done" : ""}">
                    <input
                      type="checkbox"
                      data-session="${sessionIndex}"
                      data-activity="${activityIndex}"
                      ${checked ? "checked" : ""}
                    />
                    <span>
                      <strong>${title}</strong>
                      <p>${description}</p>
                    </span>
                  </label>
                `;
              })
              .join("");

            return `
              <article class="session" id="sesion-${sessionIndex + 1}" aria-labelledby="title-${sessionIndex}">
                <header class="session-header">
                  <div class="session-meta">
                    <span class="chip">${session.day}</span>
                    <span class="chip">${session.duration}</span>
                    <span class="chip">${session.intensity}</span>
                    <span class="chip">${session.kind}</span>
                  </div>
                  <h2 id="title-${sessionIndex}">${sessionIndex + 1}. ${session.title}</h2>
                  <p class="session-goal">${session.goal}</p>
                </header>
                <div class="session-body">
                  <div class="session-progress">
                    <div class="progress-copy">
                      <p>Esta sesión</p>
                      <span id="session-label-${sessionIndex}">0 de ${session.activities.length}</span>
                    </div>
                    <div class="bar" aria-hidden="true"><span id="session-bar-${sessionIndex}"></span></div>
                  </div>
                  ${session.diagram ? renderCourt() : ""}
                  <div class="activity-list">${activities}</div>
                  <div class="footer-actions">
                    <button class="mini-btn" type="button" data-complete-session="${sessionIndex}">
                      Marcar sesión completa
                    </button>
                    <p class="note">Sesión ${sessionIndex + 1} de ${sessions.length}</p>
                  </div>
                </div>
              </article>
            `;
          })
          .join("");
      }

      function renderCourt() {
        return `
          <div class="focus-box">
            <h3>Mapa de ghosting</h3>
            <p>Sal desde el centro, llega con estocada a una zona, simula el golpe y vuelve rápido al centro.</p>
            <div class="court" aria-label="Diagrama de seis puntos para ghosting">
              <span class="spot" style="left: 18%; top: 18%;">AI</span>
              <span class="spot" style="left: 50%; top: 18%;">C</span>
              <span class="spot" style="left: 82%; top: 18%;">AD</span>
              <span class="spot center" style="left: 50%; top: 50%;">X</span>
              <span class="spot" style="left: 18%; top: 82%;">BI</span>
              <span class="spot" style="left: 50%; top: 82%;">F</span>
              <span class="spot" style="left: 82%; top: 82%;">BD</span>
            </div>
          </div>
        `;
      }

      function setCurrentIndex(nextIndex, replaceHash = false) {
        currentIndex = clamp(nextIndex, 0, sessions.length - 1);
        localStorage.setItem(lastSessionKey, String(currentIndex));
        const nextHash = `#sesion-${currentIndex + 1}`;
        if (replaceHash) {
          history.replaceState(null, "", nextHash);
        } else {
          history.pushState(null, "", nextHash);
        }
        updateView();
      }

      function updateView() {
        document.querySelectorAll(".session").forEach((session, index) => {
          session.classList.toggle("is-active", index === currentIndex);
        });
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === sessions.length - 1;
        dateStatus.textContent = `${currentIndex + 1} de ${sessions.length}`;
        updateProgress();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateProgress() {
        let doneTotal = 0;
        sessions.forEach((session, sessionIndex) => {
          let doneSession = 0;
          session.activities.forEach((_, activityIndex) => {
            if (progress[activityKey(sessionIndex, activityIndex)]) {
              doneSession += 1;
              doneTotal += 1;
            }
          });
          const sessionPercent = Math.round((doneSession / session.activities.length) * 100);
          const sessionBar = document.querySelector(`#session-bar-${sessionIndex}`);
          const sessionLabel = document.querySelector(`#session-label-${sessionIndex}`);
          if (sessionBar) sessionBar.style.width = `${sessionPercent}%`;
          if (sessionLabel) sessionLabel.textContent = `${doneSession} de ${session.activities.length}`;
        });
        const globalPercent = Math.round((doneTotal / totalActivities) * 100);
        globalProgressBar.style.width = `${globalPercent}%`;
        globalProgressLabel.textContent = `${doneTotal} de ${totalActivities}`;
      }

      renderSessions();
      updateView();
      history.replaceState(null, "", `#sesion-${currentIndex + 1}`);

      prevBtn.addEventListener("click", () => setCurrentIndex(currentIndex - 1));
      nextBtn.addEventListener("click", () => setCurrentIndex(currentIndex + 1));
      todayBtn.addEventListener("click", () => setCurrentIndex(getTodayIndex()));

      root.addEventListener("change", (event) => {
        if (!event.target.matches("input[type='checkbox']")) return;
        const sessionIndex = Number(event.target.dataset.session);
        const activityIndex = Number(event.target.dataset.activity);
        const key = activityKey(sessionIndex, activityIndex);
        progress[key] = event.target.checked;
        if (!event.target.checked) delete progress[key];
        event.target.closest(".activity").classList.toggle("is-done", event.target.checked);
        writeProgress();
        updateProgress();
      });

      root.addEventListener("click", (event) => {
        const button = event.target.closest("[data-complete-session]");
        if (!button) return;
        const sessionIndex = Number(button.dataset.completeSession);
        sessions[sessionIndex].activities.forEach((_, activityIndex) => {
          progress[activityKey(sessionIndex, activityIndex)] = true;
        });
        writeProgress();
        renderSessions();
        updateView();
      });

      resetBtn.addEventListener("click", () => {
        const shouldReset = window.confirm("¿Quieres borrar todos los checks marcados?");
        if (!shouldReset) return;
        progress = {};
        writeProgress();
        renderSessions();
        updateView();
      });

      window.addEventListener("hashchange", () => {
        const hashMatch = window.location.hash.match(/sesion-(\d+)/);
        if (!hashMatch) return;
        currentIndex = clamp(Number(hashMatch[1]) - 1, 0, sessions.length - 1);
        localStorage.setItem(lastSessionKey, String(currentIndex));
        updateView();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch(() => {});
        });
      }

    </script>
  </body>
</html>
